name: eval-gate

on:
  pull_request:
    branches: [sqlsentinel, main]
  push:
    branches: [sqlsentinel]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      # BIRD is 1.4 GB and gitignored, so the database-backed tests skip here.
      # Unit tests for extraction, confidence, routing and caching still run.
      - run: uv run pytest -q
      - run: uv run ruff check src tests

  regression-gate:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev

      - name: Restore BIRD dev subset
        id: bird
        uses: actions/cache@v4
        with:
          path: data/bird
          key: bird-dev-20240627

      # Without the benchmark databases the gate cannot score anything. Fail
      # loudly rather than passing vacuously -- a green check that measured
      # nothing is worse than a red one.
      - name: Require benchmark data
        if: steps.bird.outputs.cache-hit != 'true'
        run: |
          echo "::error::BIRD dev set not in cache. Populate the 'bird-dev-20240627'"
          echo "::error::cache before this gate can enforce accuracy."
          exit 1

      - name: Score the 50-question subset
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SQLSENTINEL_PROVIDER: gemini
        run: |
          uv run python -m sqlsentinel.eval \
            --split dev_50 --predictor agent --provider gemini \
            --workers 1 --tag ci --no-mlflow > eval.txt
          cat eval.txt

      - name: Fail if accuracy dropped more than 3 points
        run: uv run python scripts/check_regression.py eval.txt
