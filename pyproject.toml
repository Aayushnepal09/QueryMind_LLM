[project]
name = "sqlsentinel"
version = "0.1.0"
description = "Evaluation-driven text-to-SQL agent with calibrated confidence and human-in-the-loop routing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # agent core
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    # LLM providers (all free-tier / local)
    "google-genai>=1.0",       # Gemini free tier
    "ollama>=0.3",             # local qwen2.5-coder
    # data + db
    "pandas>=2.2",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",    # retained QueryMind Postgres path
    # eval + confidence
    "mlflow>=2.14",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    # service + ui
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.36",
    "bcrypt>=4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "matplotlib>=3.9",   # calibration plots
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlsentinel"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
