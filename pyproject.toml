[project]
name = "sqlsentinel"
version = "0.1.0"
description = "Evaluation-driven text-to-SQL agent with calibrated confidence and human-in-the-loop routing"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Aayush Nepal" }]
keywords = ["text-to-sql", "llm", "evaluation", "bird-sql", "calibration", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # agent core
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    # LLM providers (all free-tier / local)
    "google-genai>=1.0",       # Gemini free tier
    "ollama>=0.3",             # local qwen2.5-coder
    # data + db
    "pandas>=2.2",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",    # retained QueryMind Postgres path
    # eval + confidence
    "mlflow>=2.14",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    # service + ui
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.36",
    "bcrypt>=4.1",
    "func-timeout>=4.3.5",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "matplotlib>=3.9",   # calibration plots
    "pre-commit>=3.7",
    "pillow>=12.3.0",
    "playwright>=1.62.0",
]
mcp = [
    "fastmcp>=4.0.2",
]

[project.urls]
Repository = "https://github.com/Aayushnepal09/QueryMind_LLM"
Results = "https://github.com/Aayushnepal09/QueryMind_LLM/blob/sqlsentinel/results/RESULTS.md"

[project.scripts]
sqlsentinel-eval = "sqlsentinel.eval.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlsentinel"]

[tool.ruff]
line-length = 100
target-version = "py311"
# BIRD's official scorer is vendored verbatim so that "wrapped, not
# reimplemented" is literally true and the file can be diffed against upstream.
# Linting or formatting it would break exactly the property that makes it
# citable, so it is excluded rather than fixed.
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "ARG", "PTH"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
# Tracing and cache teardown deliberately swallow exceptions: observability
# must never break the thing it observes.
"src/sqlsentinel/tracing.py" = ["S110", "BLE001"]
# ARG002: test doubles implement the LLMClient contract, so their _call
# signatures must match the base class even where a parameter is unused.
# ARG001: fixtures are frequently requested for their side effects (setting up
# a database, monkeypatching a module global) rather than their return value.
"tests/*" = ["S101", "ARG001", "ARG002"]
# Emits Markdown prose; typographic minus, en dash and multiplication sign are
# intentional there, not confusable-character mistakes in code.
"scripts/build_report.py" = ["RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "app"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:fastapi.*",
]

[tool.coverage.run]
source = ["src/sqlsentinel"]
